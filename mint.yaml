version: 1
name: setlist.fm
slug: setlist
summary: >-
  setlist.fm concert data for Claude — search setlists, artists, venues,
  tours, and cities via natural language
examples:
  - prompt: What did Radiohead play at their most recent show, and how many songs was it?
    note: Finds the artist, then pulls their latest setlist
  - prompt: Who played at Red Rocks Amphitheatre on 2023-08-12, and what was each set?
    note: Searches every performer at one venue on one date
  - prompt: >-
      Find the setlists for these shows I went to: Pearl Jam 2018-08-10 in
      Seattle, and Phish 2019-12-31 in New York
    note: Resolves a batch of concerts in a single call
#
# Hosting note (a comment, not user-facing summary text): this is a
# BROWSER-BRIDGE MCP — it reaches its site through the user's signed-in
# tab via ContextMint Bridge. A bridged registration also needs runtime
# `fly-shared`, `bridge: true` and a `bridgePortEnv`, which are registration
# fields this manifest has no schema for (set them over the control API).
# `state.dataDir` below is required for `bridge`.
env:
  - name: SETLIST_API_KEY
    secret: true
    required: true
    help: >-
      Your setlist.fm API key (apply at setlist.fm/settings/api)
  - name: SETLIST_ACCEPT_LANGUAGE
    required: false
    help: >-
      Optional language for city/country names (en, es, fr, de, pt, tr, it, pl)
  - name: SETLIST_SESSION_COOKIE
    secret: true
    required: false
    help: >-
      Optional. Logged-in www.setlist.fm Cookie header — enables the attendance
      write tools.
state:
  dataDir: true
  reason: >-
    The fetchproxy identity lives at $HOME/.fetchproxy/identity/<name>.json
    and the pair code derives from it. Without a persistent $HOME every cold
    start mints a fresh identity and re-prompts pairing in the browser; the
    API refuses bridge without it.
egress:
  allow:
    # Only hosts the SERVER process actually fetches. Hosts that appear
    # solely in a URL this server BUILDS and returns are excluded.
    #
    # Unlike a pure bridge MCP, this process dials setlist.fm DIRECTLY in
    # every mode: the bridge is used once, lazily, to lift the www session
    # cookie out of the signed-in tab (src/fetchproxy-cookie.ts), and is
    # never on the request path. Matching is exact, so the apex and www are
    # separate entries and the apex is NOT listed: no base URL names it
    # (src/client.ts, src/web-client.ts), and its 301 to www is a hop the
    # process never requests.
    - api.setlist.fm   # public REST API, x-api-key — every read tool
    - www.setlist.fm   # attendance tools: server-rendered pages + Wicket AJAX
